# ---------------------------------------------------------------------------
# Eval gate thresholds (referenced by evals/eval_gate.py defaults)
# ---------------------------------------------------------------------------
gate_thresholds:
  max_score_drop: 0.15       # 15% regression from baseline triggers gate fail
  min_category_score: 0.70   # No single task category below 70%
  max_p95_multiplier: 1.50   # P95 must not exceed 150% of baseline
